<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="장예원 웹 디자이너 — Slowly. like a drawing. Lasting. like an experience.">
  <title>Jang Ye Won — Web Designer</title>
  <link rel="preload" href="./fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./styles.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-visual" aria-hidden="true">
        <video class="hero-video" src="./assets/hero-2.mp4" muted playsinline preload="auto" tabindex="-1" disablepictureinpicture></video>
      </div>
      <header class="hero-header">
        <!-- Section destinations will be connected as each section is built. -->
        <nav aria-label="포트폴리오 목차">
          <ul class="hero-menu" lang="en">
            <li><span>About</span></li>
            <li><span>Works</span></li>
            <li><span>Projects</span></li>
            <li><span>Contact</span></li>
          </ul>
        </nav>
      </header>
      <div class="hero-copy" lang="en">
        <h1 id="hero-title">
          <span class="hero-line"><span class="word-slowly">Slowly.</span> like a drawing.</span>
          <span class="hero-line"><span class="word-lasting">Lasting.</span> <span class="phrase">like an experience.</span></span>
        </h1>
        <span class="copy-rule" aria-hidden="true"></span>
        <p class="signature">JANG YE WON <span>/</span> WEB DESIGNER</p>
      </div>
      <button class="video-control" type="button" aria-label="배경 영상 재생" hidden>재생</button>
    </section>
  </main>
</body>
</html>
